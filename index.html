<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIDER SENSE — Field Intelligence</title>
<meta name="description" content="Spider Sense — a Flipper Zero surveillance-device field sensor. A field-ops module of the Anansi project.">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta property="og:title" content="SPIDER SENSE — Field Intelligence">
<meta property="og:description" content="A Flipper Zero surveillance-device field sensor. A field-ops module of Operation Anansi.">
<meta property="og:image" content="https://tvw-80.github.io/spider-sense/images/link-icon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://tvw-80.github.io/spider-sense/images/link-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #121212;
    --paper: #d3d8de;                 /* silver page tone */
    --silver-light: #eef1f4;
    --silver: #c7ccd3;
    --silver-dark: #a6acb5;
    --panel: linear-gradient(158deg, #ffffff 0%, #eef1f4 42%, #d9dee4 100%);          /* chrome plate */
    --chrome: linear-gradient(180deg, #f7f9fa 0%, #d4d9df 47%, #b7bdc6 53%, #e8ebee 100%); /* brushed metal strip */
    --green: #15a34a;
    --green-bright: #28c766;
    --green-deep: #0f7a37;
    --yellow: #ffe24a;
    --red: #ef3e36;
    --display: 'Bangers', cursive;
    --body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background-color: var(--paper);
    background-image:
      radial-gradient(circle, rgba(18,18,18,0.05) 1px, transparent 1.3px),
      linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 32%),
      radial-gradient(circle at 50% -5%, rgba(21,163,74,0.12), transparent 55%),
      linear-gradient(160deg, #e7eaee 0%, #cfd4da 50%, #bcc2ca 100%);
    background-size: 7px 7px, 100% 100%, 100% 100%, 100% 100%;
    background-attachment: fixed;
    font-family: var(--body);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 28px 18px;
    -webkit-font-smoothing: antialiased;
  }
  .cover { width: 100%; max-width: 560px; }

  /* spinning cross-link badge → Anansi */
  .crosslink {
    position: fixed; top: 14px; right: 14px; z-index: 60;
    width: 64px; height: 64px; display: block; border: none; border-radius: 50%;
  }
  .crosslink img {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    border: 3px solid var(--ink); background: #020202;
    box-shadow: 3px 3px 0 var(--ink);
    animation: spin 9s linear infinite;
  }
  .crosslink:hover img { animation-duration: 2.2s; }
  .crosslink::after {
    content: "OPERATION ANANSI";
    position: absolute; top: 50%; right: 74px; transform: translateY(-50%);
    white-space: nowrap; font-family: var(--display); font-size: 13px; letter-spacing: 0.04em;
    color: var(--ink); background: var(--chrome); border: 2px solid var(--ink);
    padding: 3px 9px 1px; box-shadow: 2px 2px 0 var(--ink);
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .crosslink:hover::after { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .crosslink img { animation: none; } }

  .issue-strip {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--chrome); color: var(--ink);
    font-family: var(--display); letter-spacing: 0.06em;
    font-size: 15px; padding: 7px 16px;
    border: 3px solid var(--ink);
  }
  .issue-strip .num { color: var(--green-deep); }

  .cover-panel {
    position: relative;
    background: var(--panel);
    border: 4px solid var(--ink);
    border-top: none;
    box-shadow: 8px 8px 0 var(--ink);
    padding: 30px 26px 30px;
    text-align: center;
    overflow: hidden;
  }
  .cover-panel::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(21,163,74,0.10) 1.3px, transparent 1.6px);
    background-size: 9px 9px;
    pointer-events: none;
  }
  .emblem { position: relative; width: 210px; height: 210px; margin: 0 auto 8px; filter: drop-shadow(5px 5px 0 rgba(18,18,18,0.18)); }

  .logo {
    position: relative;
    font-family: var(--display);
    font-size: clamp(54px, 15vw, 82px);
    line-height: 0.86;
    margin: 4px 0 0;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--green);
  }
  .logo span { display: block; color: var(--green); text-shadow: 3px 3px 0 var(--ink); }

  .tag {
    position: relative;
    font-weight: 800; font-size: 13px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink);
    margin: 14px 0 0;
  }
  .sub {
    position: relative;
    font-weight: 600; font-size: 12px; letter-spacing: 0.04em;
    color: #4a4a4a; margin: 6px 0 22px;
  }
  .sub a { color: var(--green-deep); text-decoration: none; border-bottom: 2px solid var(--green); }

  .cta {
    position: relative;
    display: inline-block;
    font-family: var(--display); font-size: 24px; letter-spacing: 0.04em;
    color: var(--silver-light); background: var(--ink);
    text-decoration: none; padding: 11px 28px;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--green);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .cta:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--green); background: var(--green); }
  .cta:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--green); }

  .footer-strip {
    background: var(--green); color: var(--ink);
    font-family: var(--display); letter-spacing: 0.06em; font-size: 14px;
    text-align: center; padding: 6px 16px;
    border: 3px solid var(--ink); border-top: none;
  }
  @media (prefers-reduced-motion: reduce) { .cta { transition: none; } }
  @media (max-width: 440px) { .crosslink { width: 52px; height: 52px; } }
</style>
</head>
<body>
  <a class="crosslink" href="https://tvw-80.github.io/Ananasi-intel/" target="_blank" rel="noopener" title="Operation Anansi" aria-label="Go to Operation Anansi">
    <img src="images/anansi-logo.svg" alt="Operation Anansi logo">
  </a>
  <div class="cover">
    <div class="issue-strip">
      <span>OPERATION&nbsp;ANANSI</span>
      <span>FIELD OPS&nbsp;·&nbsp;<span class="num">ISSUE 01</span></span>
    </div>
    <div class="cover-panel">
      <img class="emblem" src="images/spider-sense-logo.png" alt="Spider Sense logo — a masked web-slinger in a green web">
      <h1 class="logo">SPIDER<span>SENSE</span></h1>
      <p class="tag">Flipper Zero Field Intelligence</p>
      <p class="sub">a field-ops module of <a href="https://tvw-80.github.io/Ananasi-intel/">OPERATION ANANSI</a></p>
      <a class="cta" href="./debrief/">OPEN THE DEBRIEF →</a>
    </div>
    <div class="footer-strip">SURVEILLANCE-DEVICE DETECTOR · FLIPPER ZERO + ESP32</div>
  </div>
</body>
</html>
